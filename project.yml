name: OpenThanks
options:
  bundleIdPrefix: com.openthanks
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  OpenThanks:
    type: application
    platform: iOS
    sources:
      - path: OpenThanks
      - path: OpenThanksShared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: OpenThanksWidget
      - target: OpenThanksShare
    info:
      path: OpenThanks/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Full-size launch screen (without it iOS letterboxes the app).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Deep-link scheme for the Supabase OAuth redirect (openthanks://auth-callback).
        CFBundleURLTypes:
          - CFBundleURLName: com.openthanks.app
            CFBundleURLSchemes: [openthanks]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Attach a photo to your appreciation.
        NSSiriUsageDescription: OpenThanks uses Siri to help you thank someone or start an appreciation.
        NSCalendarsUsageDescription: OpenThanks reads today’s meetings to suggest one person you might want to thank each evening. Events stay on your device.
        NSCalendarsFullAccessUsageDescription: OpenThanks reads today’s meetings and attendees to suggest one person you might want to thank each evening. Events stay on your device.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.openthanks.app.calendar-gratitude-refresh
    entitlements:
      path: OpenThanks/OpenThanks.entitlements
      properties:
        aps-environment: production
        com.apple.developer.associated-domains:
          - applinks:openthanks.com
          - applinks:www.openthanks.com
        com.apple.security.application-groups:
          - group.com.openthanks.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OpenThanksWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenThanksWidget
      - path: OpenThanksShared
    info:
      path: OpenThanksWidget/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OpenThanksWidget/OpenThanksWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openthanks.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app.widget
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: false

  OpenThanksShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenThanksShare
      - path: OpenThanksShared
        excludes:
          - WidgetSnapshot.swift
    info:
      path: OpenThanksShare/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >
              SUBQUERY (
                extensionItems,
                $extensionItem,
                SUBQUERY (
                  $extensionItem.attachments,
                  $attachment,
                  ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.jpeg"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.png"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.vcard"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.contact"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.calendar-event"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.ical.ics"
                ).@count > 0
              ).@count > 0
    entitlements:
      path: OpenThanksShare/OpenThanksShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openthanks.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app.share
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_CFBundleDisplayName: OpenThanks

schemes:
  OpenThanks:
    build:
      targets:
        OpenThanks: all
        OpenThanksWidget: [build]
        OpenThanksShare: [build]
    run:
      config: Debug
    archive:
      config: Release

  # Run this scheme to preview widgets. Change `_XCWidgetKind` to switch:
  # GratitudePromptWidget | SendThanksWidget | ReceivedThanksWidget
  OpenThanksWidget:
    build:
      targets:
        OpenThanksWidget: all
        OpenThanks: [build]
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: GratitudePromptWidget
        _XCWidgetFamily: systemMedium
