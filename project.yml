name: OpenThanks
options:
  bundleIdPrefix: com.openthanks
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  # App Store Connect requires watch companions under Watch/ (not PlugIns/).
  # XcodeGen already emits that; only add CodeSignOnCopy on the embed.
  postGenCommand: |
    python3 - <<'PY'
    from pathlib import Path
    import re
    path = Path("OpenThanks.xcodeproj/project.pbxproj")
    text = path.read_text()
    text2, n = re.subn(
        r'(OpenThanksWatch\.app in Embed Watch Content \*/ = \{isa = PBXBuildFile; fileRef = [A-F0-9]+ /\* OpenThanksWatch\.app \*/; settings = \{ATTRIBUTES = \()(?!CodeSignOnCopy)(RemoveHeadersOnCopy, \); \}; \};)',
        r'\1CodeSignOnCopy, \2',
        text,
        count=1,
    )
    if n:
        text = text2
    # Safety: never leave Watch content in PlugIns (App Store rejects it).
    if 'Embed Watch Content' in text and 'CONTENTS_FOLDER_PATH)/Watch' not in text:
        raise SystemExit("postGenCommand: Watch embed is not under Watch/ — aborting")
    path.write_text(text)
    print("postGenCommand: Watch companion under Watch/ with CodeSignOnCopy")
    PY
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.28.0
targets:
  OpenThanks:
    type: application
    platform: iOS
    sources:
      - path: OpenThanks
      - path: OpenThanksShared
    dependencies:
      - package: Supabase
        product: Supabase
      - package: PostHog
        product: PostHog
      - target: OpenThanksWidget
      - target: OpenThanksShare
      - target: OpenThanksWatch
    info:
      path: OpenThanks/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Full-size launch screen (without it iOS letterboxes the app).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Deep-link scheme for the Supabase OAuth redirect (openthanks://auth-callback).
        CFBundleURLTypes:
          - CFBundleURLName: com.openthanks.app
            CFBundleURLSchemes: [openthanks]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Attach a photo to your appreciation.
        NSSiriUsageDescription: OpenThanks uses Siri to help you thank someone or start an appreciation.
        NSCalendarsUsageDescription: OpenThanks reads today’s meetings to suggest one person you might want to thank each evening. Events only stay on your device and never seen by anyone.
        NSCalendarsFullAccessUsageDescription: OpenThanks reads today’s meetings and attendees to suggest one person you might want to thank each evening. Events only stay on your device and never seen by anyone.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.openthanks.app.calendar-gratitude-refresh
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-Ember:
              CFBundleIconFiles:
                - AppIcon-Ember
              UIPrerenderedIcon: false
            AppIcon-Dawn:
              CFBundleIconFiles:
                - AppIcon-Dawn
              UIPrerenderedIcon: false
            AppIcon-Night:
              CFBundleIconFiles:
                - AppIcon-Night
              UIPrerenderedIcon: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: OpenThanks/OpenThanks.entitlements
      properties:
        aps-environment: production
        com.apple.developer.associated-domains:
          - applinks:openthanks.com
          - applinks:www.openthanks.com
        com.apple.security.application-groups:
          - group.com.openthanks.app
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OpenThanksWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenThanksWidget
      - path: OpenThanksShared
        excludes:
          - WatchRelay.swift
    info:
      path: OpenThanksWidget/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OpenThanksWidget/OpenThanksWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openthanks.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app.widget
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: false

  OpenThanksShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenThanksShare
      - path: OpenThanksShared
        excludes:
          - WidgetSnapshot.swift
          - WatchRelay.swift
    info:
      path: OpenThanksShare/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >
              SUBQUERY (
                extensionItems,
                $extensionItem,
                SUBQUERY (
                  $extensionItem.attachments,
                  $attachment,
                  ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.jpeg"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.png"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.vcard"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.contact"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.calendar-event"
                  OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.ical.ics"
                ).@count > 0
              ).@count > 0
    entitlements:
      path: OpenThanksShare/OpenThanksShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openthanks.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app.share
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_CFBundleDisplayName: OpenThanks

  OpenThanksWatch:
    type: application
    platform: watchOS
    sources:
      - path: OpenThanksWatch
      - path: OpenThanksShared
        excludes:
          - ComposeSharePayload.swift
          - AppGroup+Files.swift
    dependencies:
      - target: OpenThanksWatchWidgets
      - sdk: WatchConnectivity.framework
    info:
      path: OpenThanksWatch/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        WKCompanionAppBundleIdentifier: com.openthanks.app
        WKApplication: true
        # Independent so Xcode can install the Watch app directly; phone relay still works.
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleURLTypes:
          - CFBundleURLName: com.openthanks.app.watch
            CFBundleURLSchemes: [openthanks-watch]
    entitlements:
      path: OpenThanksWatch/OpenThanksWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openthanks.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app.watch
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        # YES for Archive/TestFlight so only OpenThanks.app is the distributable product.
        SKIP_INSTALL: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.openthanks.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
      configs:
        # Allow Run → Apple Watch during development without breaking Release archives.
        Debug:
          SKIP_INSTALL: NO

  OpenThanksWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: OpenThanksWatchWidgets
      - path: OpenThanksShared
        excludes:
          - ComposeSharePayload.swift
          - AppGroup+Files.swift
          - WatchRelay.swift
    info:
      path: OpenThanksWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: OpenThanks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WKCompanionAppBundleIdentifier: com.openthanks.app
    entitlements:
      path: OpenThanksWatchWidgets/OpenThanksWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openthanks.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openthanks.app.watch.widgets
        DEVELOPMENT_TEAM: 53CL59ATX8
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_STYLE: Automatic
        SDKROOT: watchos
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  OpenThanks:
    build:
      targets:
        OpenThanks: all
        OpenThanksWidget: all
        OpenThanksShare: all
        OpenThanksWatch: all
        OpenThanksWatchWidgets: all
    run:
      config: Debug
    archive:
      config: Release

  OpenThanksWatch:
    build:
      targets:
        OpenThanksWatch: all
        OpenThanksWatchWidgets: all
        # Build iOS host for embedding, but do not launch it from this scheme.
        OpenThanks: [test, profile, analyze, archive]
    run:
      config: Debug
      executable: OpenThanksWatch
    profile:
      config: Release
      executable: OpenThanksWatch

  # Run this scheme to preview widgets. Change `_XCWidgetKind` to switch:
  # GratitudePromptWidget | SendThanksWidget | ReceivedThanksWidget
  OpenThanksWidget:
    build:
      targets:
        OpenThanksWidget: all
        OpenThanks: [build]
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: GratitudePromptWidget
        _XCWidgetFamily: systemMedium
